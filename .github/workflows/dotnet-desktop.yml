name: .NET Desktop CI

on:
  push:
    tags: [ "v*" ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build, test, and package
    runs-on: windows-latest

    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: "1"
      DOTNET_NOLOGO: "1"
      SOLUTION_PATH: GameSubRelay.sln
      APP_PROJECT_PATH: src/GameSubRelay.App/GameSubRelay.App.csproj
      ARTIFACT_NAME: SubRelay-win-x64

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restore
        run: dotnet restore $env:SOLUTION_PATH

      - name: Build
        run: dotnet build $env:SOLUTION_PATH -c Release --no-restore

      - name: Test
        run: dotnet test $env:SOLUTION_PATH -c Release --no-build --logger trx --results-directory TestResults

      - name: Publish win-x64
        run: dotnet publish $env:APP_PROJECT_PATH -c Release -r win-x64 --self-contained false -o artifacts/$env:ARTIFACT_NAME

      - name: Zip artifact
        shell: pwsh
        run: Compress-Archive -Path "artifacts/$env:ARTIFACT_NAME/*" -DestinationPath "artifacts/$env:ARTIFACT_NAME.zip" -Force

      - name: Upload app artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ARTIFACT_NAME }}
          path: artifacts/${{ env.ARTIFACT_NAME }}.zip
          if-no-files-found: error

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: TestResults/*.trx
          if-no-files-found: ignore
